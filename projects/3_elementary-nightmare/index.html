<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SchoolQuestGame</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div
      id="cover-screen"
      style="
        position: fixed;
        inset: 0;
        z-index: 100;
        background: black;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 60px;
        overflow: hidden;
      "
    >
      <img
        id="cover-bg"
        src="assets/images/cover.png"
        alt=""
        style="
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center top;
        "
      />
      <div
        id="cover-content"
        style="
          position: relative;
          z-index: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
          text-align: center;
          padding: 0 20px;
        "
      >
        <div
          id="cover-title"
          style="
            font-family: monospace;
            font-size: clamp(22px, 6vw, 42px);
            color: white;
            letter-spacing: 2px;
            text-shadow:
              0 0 20px rgba(0, 0, 0, 0.9),
              2px 2px 0 black;
            line-height: 1.2;
          "
        >
          The Elementary<br />Nightmare
        </div>
        <div
          id="cover-subtitle"
          style="
            font-family: monospace;
            font-size: clamp(11px, 2.2vw, 14px);
            color: rgba(255, 255, 255, 0.75);
            max-width: 480px;
            line-height: 1.6;
            text-shadow: 1px 1px 4px black;
          "
        >
          Based on a true story — a boy named Thomas ate a Snickers bar, not
          knowing it contained peanuts. Find the EpiPen before it's too late.
        </div>
        <button
          id="cover-start-btn"
          style="
            display: inline-block;
            width: auto;
            padding: 10px 36px;
            background: transparent;
            color: white;
            border: 1px solid white;
            cursor: pointer;
            font-family: monospace;
            font-size: clamp(14px, 2.8vw, 18px);
            letter-spacing: 1px;
          "
        >
          Start Game
        </button>
      </div>
      <div
        id="cover-fade"
        style="
          position: absolute;
          inset: 0;
          background: black;
          opacity: 0;
          pointer-events: none;
          z-index: 2;
        "
      ></div>
    </div>

    <div id="game-wrapper">
      <p id="narrative"></p>

      <div id="scene-container">
        <img id="scene-img" src="assets/images/cover.png" />
        <img id="character-img" src="" />
        <img id="map" src="" alt="" />
        <div id="scene-fade"></div>
      </div>

      <div id="health-bar">
        <div id="health-track">
          <div id="health-fill"></div>
        </div>
      </div>

      <p id="dialogue"></p>

      <div id="choices"></div>

      <button id="map-button">Show Map (M)</button>
    </div>

    <script src="assets/js/script.js"></script>
  </body>
</html>
